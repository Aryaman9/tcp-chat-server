name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
            sanitizers: 'OFF'
          - name: Release
            build_type: Release
            sanitizers: 'OFF'
          - name: ASan and UBSan
            build_type: Debug
            sanitizers: 'ON'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run two-client demo
        run: python3 tests/demo_chat.py ./build/chat_server ./build/chat_client
